<div class="p-6">
  <div class="container mx-auto">
    <h2 class="text-2xl font-semibold mb-6 text-center">Employee List</h2>

    <div *ngIf="loading" class="text-center text-gray-500 text-lg">Loading...</div>

    <div *ngIf="!loading">
      <div *ngFor="let e of employees" class="mb-8 bg-white shadow-lg rounded-lg p-6">

        <!-- 🧑 Employee Info -->
        <div class="flex justify-between items-center mb-4 border-b pb-2">
          <div>
            <h3 class="text-xl font-semibold text-gray-800">
              {{ e.firstName }} {{ e.lastName }}
            </h3>
            <p class="text-gray-600 text-sm">Email: {{ e.email }}</p>
            <p class="text-gray-600 text-sm">Employee ID: {{ e.id }}</p>
          </div>

          <div class="space-x-2">
            <button (click)="edit(e.id)"
              class="px-4 py-1 bg-blue-600 text-white rounded-full hover:bg-blue-700 transition-all duration-300">
              ✏️ Edit
            </button>
            <button (click)="remove(e.id)"
              class="px-4 py-1 bg-red-600 text-white rounded-full hover:bg-red-700 transition-all duration-300">
              🗑️ Delete Employee
            </button>
          </div>
        </div>

        <!-- 🎓 Education Table -->
        <div *ngIf="e.educationList && e.educationList.length > 0; else noEducation">
          <h4 class="text-lg font-semibold mb-2 text-gray-700">Educational Information</h4>

          <table class="min-w-full border rounded-md overflow-hidden">
            <thead class="bg-gray-100">
              <tr>
                <th class="px-4 py-2 text-left">Degree</th>
                <th class="px-4 py-2 text-left">Institution</th>
                <th class="px-4 py-2 text-left">Result</th>
                <th class="px-4 py-2 text-left">Passing Year</th>
                <th class="px-4 py-2 text-center">Action</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let edu of e.educationList" class="border-t hover:bg-gray-50">
                <td class="px-4 py-2">{{ edu.degree }}</td>
                <td class="px-4 py-2">{{ edu.institution }}</td>
                <td class="px-4 py-2">{{ edu.result }}</td>
                <td class="px-4 py-2">{{ edu.passingYear }}</td>
                <td class="px-4 py-2 text-center">
                  <button (click)="removeEducation(e.id, edu.id)"
                    class="px-3 py-1 text-sm bg-red-500 text-black rounded-full hover:bg-red-300">
                     Delete
                  </button>
                </td>
              </tr>
            </tbody>
          </table>
        </div>

        <ng-template #noEducation>
          <p class="text-gray-500 italic">No educational information available.</p>
        </ng-template>
      </div>
    </div>
  </div>
</div>
