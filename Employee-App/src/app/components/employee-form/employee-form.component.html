<div class="p-6">
  <div class="container mx-auto max-w-2xl bg-white p-6 rounded-lg shadow-md">
    <h2 class="text-2xl font-semibold mb-4 text-center">Add Employee</h2>

    <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-4">
      <!-- Employee Basic Info -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-gray-700 mb-1">First Name</label>
          <input formControlName="firstName"
            class="w-full p-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-400" />
        </div>

        <div>
          <label class="block text-gray-700 mb-1">Last Name</label>
          <input formControlName="lastName"
            class="w-full p-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-400" />
        </div>
      </div>

      <div>
        <label class="block text-gray-700 mb-1">Email</label>
        <input formControlName="email"
          class="w-full p-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-400" />
      </div>

      <!-- Add Education Button -->
      <div class="text-center">
        <!-- <button type="button" (click)="showEducationForm = true" *ngIf="!showEducationForm"
          class="bg-blue-600 text-white px-4 py-2 rounded-full mt-4 hover:bg-blue-700">
          ➕ Add Education
        </button> -->
        <button type="button" (click)="onAddEducationClick()" *ngIf="!showEducationForm"
          class="bg-blue-600 text-white px-4 py-2 rounded-full mt-4 hover:bg-blue-700">
          ➕ Add Education
        </button>

      </div>

      <!-- Education Form Section -->
      <div *ngIf="showEducationForm" class="mt-6 border-t pt-4">
        <h3 class="text-lg font-semibold mb-3 text-gray-700">Educational Information</h3>

        <div formArrayName="educations">
          <div *ngFor="let edu of educations.controls; let i = index" [formGroupName]="i"
            class="bg-gray-50 p-4 mb-4 rounded-lg shadow-inner">

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <div>
                <label class="block text-gray-700 mb-1">Degree</label>
                <select formControlName="degree" class="w-full p-2 border border-gray-300 rounded-md">
                  <option value="">Select Degree</option>
                  <option *ngFor="let degree of degreeList" [value]="degree">{{ degree }}</option>
                </select>
              </div>

              <div>
                <label class="block text-gray-700 mb-1">Institution</label>
                <input formControlName="institution" class="w-full p-2 border border-gray-300 rounded-md" />
              </div>

              <div>
                <label class="block text-gray-700 mb-1">Result</label>
                <input formControlName="result" class="w-full p-2 border border-gray-300 rounded-md" />
              </div>

              <div>
                <label class="block text-gray-700 mb-1">Passing Year</label>
                <input formControlName="passingYear" class="w-full p-2 border border-gray-300 rounded-md" />
              </div>
            </div>

            <div class="text-right mt-2">
              <button type="button" (click)="removeEducation(i)"
                class="text-red-600 hover:text-red-800 text-sm underline">
                Remove
              </button>
            </div>
          </div>
        </div>

        <div class="flex justify-between items-center">
          <button type="button" (click)="addEducation()"
            class="bg-blue-500 text-white px-3 py-1 rounded-full hover:bg-blue-600">
            ➕ More Education Add
          </button>
        </div>
      </div>

      <!-- Final Save Button -->
      <div class="flex justify-center mt-6">
        <button type="submit" [disabled]="loading"
          class="px-6 py-2 rounded-full bg-green-600 text-white hover:bg-green-700">
          {{ loading ? 'Saving...' : 'Save All' }}
        </button>
      </div>
    </form>
  </div>
</div>
